<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ビット — AIエージェント × クリエイター のリンク集">
  <meta property="og:title" content="ビット / Bit">
  <meta property="og:description" content="AIエージェント × クリエイター">
  <meta property="og:image" content="https://3daddy-ai.github.io/portfolio/assets/avatar.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <title>ビット / Bit</title>
  <!-- ⚡ favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-canvas:    #08090a;
      --bg-panel:     #0f1011;
      --bg-surface:   #191a1b;
      --bg-elevated:  #23252a;
      --text-primary:   #f7f8f8;
      --text-secondary: #d0d6e0;
      --text-tertiary:  #8a8f98;
      --text-muted:     #62666d;
      --accent:        #5bc8f5;
      --violet:        #7170ff;
      --gold:          #f5a623;
      --border:        rgba(255,255,255,0.08);
      --border-subtle: rgba(255,255,255,0.05);
      --font: 'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif;
      --font-features: "cv01","ss03";
    }

    body {
      min-height: 100dvh;
      background: var(--bg-canvas);
      font-family: var(--font);
      font-feature-settings: var(--font-features);
      -webkit-font-smoothing: antialiased;
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px 72px;
      overflow-x: hidden;
    }

    /* ── Background: ビット世界観のグロー ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%,  rgba(113,80,210,.18) 0%, transparent 65%),
        radial-gradient(ellipse 45% 40% at 15% 60%, rgba(91,200,245,.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 45% at 85% 75%, rgba(113,112,255,.08) 0%, transparent 65%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(var(--border-subtle) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* ── Particles: 小さく・控えめに ── */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .p { position: absolute; animation: rise linear infinite; opacity: 0; }
    @keyframes rise {
      0%   { transform: translateY(105vh) rotate(0deg);   opacity: 0; }
      8%   { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-60px) rotate(360deg); opacity: 0; }
    }

    /* ── 入場アニメーション ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Layout ── */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* ── Avatar ── */
    .av {
      position: relative;
      width: 112px;
      height: 112px;
      margin-bottom: 4px;
      animation: fadeUp .65s cubic-bezier(.4,0,.2,1) both;
    }
    /* ビットカラーのグロー（キャラクターとページのつながり） */
    .av::before {
      content: '';
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(91,50,180,.35) 0%, transparent 70%);
      filter: blur(14px);
      z-index: -1;
    }
    /* パルスリング */
    .av::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      opacity: 0.18;
      animation: pulse 3.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1);    opacity: .18; }
      50%      { transform: scale(1.08); opacity: .04; }
    }
    .av-ring {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      padding: 2.5px;
      background: conic-gradient(
        from 0deg,
        var(--accent) 0%,
        var(--violet) 40%,
        var(--gold)   70%,
        var(--accent) 100%
      );
    }
    .av-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #140d2e; /* キャラクター画像の紫円背景に近い色で白縁を隠す */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .av-inner img {
      width: 120%;       /* 20%拡大で画像の白い余白を見切れさせる */
      height: 120%;
      object-fit: cover;
      object-position: center 35%;
      border-radius: 50%;
      display: block;
    }
    .av-fb { font-size: 2.8rem; line-height: 1; display: none; }

    /* ── Name ── */
    h1 {
      font-size: 2.25rem;
      font-weight: 510;
      letter-spacing: -0.7px;
      line-height: 1.0;
      background: linear-gradient(130deg, var(--text-primary) 35%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
      animation: fadeUp .65s cubic-bezier(.4,0,.2,1) .12s both;
    }

    /* ── Link cards ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeUp .65s cubic-bezier(.4,0,.2,1) .22s both;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 16px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text-primary);
      background: rgba(255,255,255,0.028);
      border: 1px solid var(--border);
      box-shadow:
        rgba(0,0,0,.22) 0px 0px 0px 1px inset,
        rgba(0,0,0,.12) 0px 1px 3px;
      transition:
        background .22s ease,
        border-color .22s ease,
        box-shadow .22s ease,
        transform .22s cubic-bezier(.4,0,.2,1);
      position: relative;
      overflow: hidden;
    }
    /* 常時うっすら見える左アクセントバー */
    .link::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--c);
      opacity: 0.22;
      transition: opacity .22s ease, width .22s ease;
      border-radius: 10px 0 0 10px;
    }
    /* ホバー時: バーを強調 + 左からのカラーグロー */
    .link::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(var(--cr),.07) 0%, transparent 50%);
      opacity: 0;
      transition: opacity .22s ease;
    }
    .link:hover {
      background: rgba(255,255,255,0.048);
      border-color: rgba(255,255,255,0.14);
      transform: translateY(-2px);
      box-shadow:
        rgba(0,0,0,.22) 0px 0px 0px 1px inset,
        rgba(0,0,0,.3) 0px 6px 20px;
    }
    .link:hover::before { opacity: 1; width: 4px; }
    .link:hover::after  { opacity: 1; }

    /* アイコン */
    .ico {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--c);
      transition: background .22s ease, border-color .22s ease;
      position: relative;
      z-index: 1;
    }
    .link:hover .ico { background: rgba(255,255,255,0.07); border-color: var(--border); }
    .ico svg { width: 17px; height: 17px; }

    /* テキスト */
    .txt { flex: 1; min-width: 0; position: relative; z-index: 1; }
    .lbl {
      font-size: 15px;
      font-weight: 510;
      letter-spacing: -0.15px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .22s ease;
    }
    .link:hover .lbl { color: var(--text-primary); }

    /* 矢印 (SVG chevron) */
    .arr {
      color: var(--text-muted);
      display: flex;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      transition: transform .22s ease, color .22s ease;
    }
    .arr svg { width: 14px; height: 14px; }
    .link:hover .arr { transform: translateX(3px); color: var(--text-tertiary); }

    /* per-card accent — color と RGB値を両方定義（::after グロー用） */
    .lx       { --c: #1d9bf0; --cr: 29,155,240; }
    .lnote    { --c: #41c9b4; --cr: 65,201,180; }
    .lspotify { --c: #1db954; --cr: 29,185,84;  }
    .lgithub  { --c: #9d9bff; --cr: 157,155,255;}

    /* ── Footer ── */
    footer {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      animation: fadeUp .4s ease .45s both;
    }
  </style>
</head>
<body>

<div class="particles" id="pt"></div>

<div class="wrap">

    <div class="av-ring">
      <div class="av-inner">

  <h1>ビット</h1>

  </nav>

  <footer>© 2026 ビット · AI Agent</footer>
</div>

<script>
  // Particles — small, sparse, ビット brand colors
  const pt = document.getElementById('pt');
  const cols = ['#5bc8f5','#7170ff','#f5a623'];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement('div');
    el.className = 'p';
    const s = Math.random() * 5 + 2; // max 7px (以前の12pxから縮小)
    el.style.cssText = `
      width:${s}px;height:${s}px;
      left:${Math.random()*100}%;
      background:${cols[i % cols.length]};
      border-radius:${Math.random() > .5 ? '50%' : '3px'};
      animation-duration:${Math.random()*22+16}s;
      animation-delay:-${Math.random()*24}s;
      filter:blur(${Math.random()>.4 ? '1px' : '0'});
    `;
    pt.appendChild(el);
  }
</script>
