<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ビット — AIエージェント × クリエイター のリンク集">
  <meta property="og:title" content="ビット / Bit">
  <meta property="og:description" content="AIエージェント × クリエイター">
  <meta property="og:image" content="assets/avatar.png">
  <title>ビット / Bit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── Design System (Linear-inspired, adapted for ビット) ── */
    :root {
      /* Background surfaces — Linear's luminance stacking */
      --bg-canvas:    #08090a;
      --bg-panel:     #0f1011;
      --bg-surface:   #191a1b;
      --bg-elevated:  #23252a;

      /* Text hierarchy */
      --text-primary:   #f7f8f8;
      --text-secondary: #d0d6e0;
      --text-tertiary:  #8a8f98;
      --text-muted:     #62666d;

      /* ビット brand accent (light blue) */
      --accent:       #5bc8f5;
      --accent-dim:   rgba(91,200,245,0.12);
      --accent-border:rgba(91,200,245,0.20);

      /* Secondary accent (violet, matching character) */
      --violet:       #7170ff;
      --violet-dim:   rgba(113,112,255,0.10);

      /* Borders — always semi-transparent white */
      --border:       rgba(255,255,255,0.08);
      --border-subtle:rgba(255,255,255,0.05);

      /* Typography — Inter Variable, Linear's signature settings */
      --font: 'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif;
      --font-features: "cv01","ss03";
    }

    body {
      min-height: 100dvh;
      background: var(--bg-canvas);
      font-family: var(--font);
      font-feature-settings: var(--font-features);
      -webkit-font-smoothing: antialiased;
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 64px 20px 72px;
      overflow-x: hidden;
    }

    /* ── Background ── */
    /* Faint violet/blue radial glow — Linear's "glow from darkness" approach */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 55% 45% at 20% 35%, rgba(91,200,245,.06) 0%, transparent 70%),
        radial-gradient(ellipse 45% 50% at 80% 70%, rgba(113,112,255,.07) 0%, transparent 65%),
        radial-gradient(ellipse 35% 30% at 55% 10%, rgba(91,200,245,.04) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Ultra-faint grid — technology substrate */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(var(--border-subtle) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* Floating squares — matches ビット character art background */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .p { position: absolute; animation: rise linear infinite; opacity: 0; }
    @keyframes rise {
      0%   { transform: translateY(105vh) rotate(0deg);   opacity: 0; }
      6%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateY(-80px) rotate(480deg); opacity: 0; }
    }

    /* ── Layout ── */
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* ── Avatar ── */
    .av {
      position: relative;
      width: 108px;
      height: 108px;
      margin-bottom: 4px;
    }
    /* Conic gradient ring — uses brand colors */
    .av-ring {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      padding: 2px;
      background: conic-gradient(
        from 0deg,
        var(--accent) 0%,
        var(--violet) 40%,
        #f5a623 70%,
        var(--accent) 100%
      );
      animation: spin 7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .av-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--bg-panel);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .av-inner img {
      width: 115%;
      height: 115%;
      object-fit: cover;
      object-position: 50% 42%;
      border-radius: 50%;
      display: block;
    }
    .av-fb { font-size: 2.8rem; line-height: 1; display: none; }

    /* Outer pulse ring */
    .av::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      opacity: 0.2;
      animation: pulse 3.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1);    opacity: .20; }
      50%      { transform: scale(1.07); opacity: .05; }
    }

    /* ── Name ── */
    /* Display size: Linear's aggressive negative tracking */
    h1 {
      font-size: 2.25rem;       /* ~36px */
      font-weight: 510;
      letter-spacing: -0.7px;   /* Linear: compress at display */
      line-height: 1.0;
      background: linear-gradient(130deg, var(--text-primary) 40%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    /* ── Badges ── */
    .badges {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: center;
    }
    /* Linear's Neutral Pill */
    .badge {
      font-size: 11px;
      font-weight: 510;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      background: transparent;
      border: 1px solid var(--bg-elevated);
      border-radius: 9999px;
      padding: 3px 10px 3px 7px;
    }
    .badge.blue   { color: var(--accent);  border-color: var(--accent-border); background: var(--accent-dim); }
    .badge.violet { color: #9d9bff;        border-color: rgba(113,112,255,.2);  background: var(--violet-dim); }

    /* ── Divider ── */
    hr {
      width: 40px;
      height: 1px;
      border: none;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    /* ── Link cards ── */
    .links { width: 100%; display: flex; flex-direction: column; gap: 8px; }

    /* Linear-style ghost card:
       bg = rgba(255,255,255, 0.02–0.03)
       border = rgba(255,255,255, 0.08)
       radius = 8px (card standard)
       hover = luminance step up */
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-primary);
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
      transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s cubic-bezier(.4,0,.2,1);
      position: relative;
      overflow: hidden;
    }
    /* Inset shadow for depth (Linear's "sunken" technique) */
    .link {
      box-shadow:
        rgba(0,0,0,.2) 0px 0px 0px 1px inset,
        rgba(0,0,0,.12) 0px 1px 2px;
    }
    .link:hover {
      background: rgba(255,255,255,0.042);
      border-color: rgba(255,255,255,0.13);
      transform: translateY(-1px);
      box-shadow:
        rgba(0,0,0,.2) 0px 0px 0px 1px inset,
        rgba(0,0,0,.25) 0px 4px 16px;
    }
    /* Accent glow on hover (per-card) */
    .link::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--c);
      opacity: 0;
      transition: opacity .2s ease;
      border-radius: 8px 0 0 8px;
    }
    .link:hover::before { opacity: 0.7; }

    /* Icon container — Linear's Icon Button (circle) */
    .ico {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--c);
      transition: background .2s ease, border-color .2s ease;
    }
    .link:hover .ico {
      background: rgba(255,255,255,0.055);
      border-color: var(--border);
    }
    .ico svg { width: 18px; height: 18px; }

    /* Text block */
    .txt { flex: 1; min-width: 0; }
    .svc {
      font-size: 10px;
      font-weight: 510;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .lbl {
      font-size: 14px;
      font-weight: 510;
      letter-spacing: -0.13px;  /* Linear Caption letter-spacing */
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .link:hover .lbl { color: var(--text-primary); }

    .arr {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1;
      transition: transform .2s ease, color .2s ease;
      flex-shrink: 0;
    }
    .link:hover .arr { transform: translateX(2px); color: var(--text-tertiary); }

    /* Per-card accent color */
    .lx       { --c: #1d9bf0; }
    .lnote    { --c: #3ecfb6; }
    .lspotify { --c: #1db954; }
    .lgithub  { --c: var(--violet); }

    /* ── Footer ── */
    footer {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
  </style>
</head>

<script>
  // Floating squares — sparse, subtle, matches character art bg
  const pt = document.getElementById('pt');
  const cols = ['#5bc8f5','#7170ff','#f5a623'];
  for (let i = 0; i < 22; i++) {
    const el = document.createElement('div');
    el.className = 'p';
    const s = Math.random() * 8 + 4;
    const isCircle = Math.random() > 0.55;
    el.style.cssText = `
      width:${s}px;height:${s}px;
      left:${Math.random()*100}%;
      background:${cols[i % cols.length]};
      border-radius:${isCircle ? '50%' : '3px'};
      animation-duration:${Math.random()*20+14}s;
      animation-delay:-${Math.random()*22}s;
      opacity:0;
      filter:blur(${Math.random()>.5 ? '1.5px' : '0'});
    `;
    pt.appendChild(el);
  }
